name: Sync vendored MCP servers from upstream

# True real-time isn't achievable (GitHub doesn't let an external repo
# subscribe to another repo's pushes without the upstream owner setting
# that up) -- daily polling is the closest real approximation. Runs on a
# schedule and can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '17 4 * * *' # once a day, off the hour to avoid GitHub's peak-time scheduling delays
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout creator-tools
        uses: actions/checkout@v4
        with:
          path: creator-tools

      - name: Sync each vendored server folder from its own upstream
        id: sync
        run: |
          set -euo pipefail
          cd creator-tools
          CHANGED=0

          # name|upstream-repo|subdir-within-that-repo ('.' for repo root)
          SERVERS=(
            "fetch|https://github.com/modelcontextprotocol/servers.git|src/fetch"
            "git|https://github.com/modelcontextprotocol/servers.git|src/git"
            "time|https://github.com/modelcontextprotocol/servers.git|src/time"
            "filesystem|https://github.com/modelcontextprotocol/servers.git|src/filesystem"
            "memory|https://github.com/modelcontextprotocol/servers.git|src/memory"
            "sequentialthinking|https://github.com/modelcontextprotocol/servers.git|src/sequentialthinking"
            "context7|https://github.com/upstash/context7.git|packages/mcp"
            "playwright|https://github.com/microsoft/playwright-mcp.git|."
          )

          declare -A CLONED_REPOS

          for entry in "${SERVERS[@]}"; do
            IFS='|' read -r name repo subdir <<< "$entry"
            DEST="mcp_servers/$name"

            if [ -z "${CLONED_REPOS[$repo]:-}" ]; then
              CLONE_DIR="../upstream_$(echo "$repo" | md5sum | cut -d' ' -f1)"
              git clone --depth 1 "$repo" "$CLONE_DIR"
              CLONED_REPOS[$repo]="$CLONE_DIR"
            fi
            CLONE_DIR="${CLONED_REPOS[$repo]}"
            UPSTREAM_COMMIT=$(cd "$CLONE_DIR" && git rev-parse HEAD)
            SRC="$CLONE_DIR/$subdir"

            if [ ! -d "$SRC" ]; then
              echo "::warning::$repo's $subdir no longer exists -- skipping $name (may need manual attention if it was renamed/removed)"
              continue
            fi

            # Preserve our own provenance marker files, then rsync
            # everything else so removed-upstream files are removed here
            # too, not just new/changed ones added. Exclude .git if the
            # subdir is a whole-repo vendor (subdir == '.').
            rsync -a --delete \
              --exclude='.vendored-from-commit' \
              --exclude='.vendored-from-source' \
              --exclude='.git' \
              --exclude='node_modules' \
              "$SRC/" "$DEST/"

            if ! git diff --quiet -- "$DEST"; then
              CHANGED=1
              echo "$UPSTREAM_COMMIT" > "$DEST/.vendored-from-commit"
              git add "$DEST"
            fi
          done

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Open a PR if anything changed
        if: steps.sync.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          path: creator-tools
          commit-message: 'chore: sync vendored MCP servers from upstream'
          branch: auto-sync/upstream-mcp-servers
          title: 'Sync vendored MCP servers from upstream'
          body: |
            Automated daily sync from each vendored server's own upstream repository (see README.md for the source mapping).

            Never auto-merged — review the diff before merging, same as any other upstream dependency bump.
          delete-branch: true
